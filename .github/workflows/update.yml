name: Update hackathons

on:
  schedule:
    - cron: "17 */6 * * *"  # every 6 hours
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["web/**", "src/**", ".github/workflows/update.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0  # this repo publishes no floating major tag

      - name: Test
        run: uv run --frozen pytest -q

      - name: Fetch all sources
        run: uv run --frozen hackathon-tracker fetch

      - name: Commit refreshed data
        # A push to main during the run would reject ours; rebase onto it (keeping the
        # fresh data on conflict) and retry. Never block the deploy over this.
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/hackathons.json
          git diff --cached --quiet && exit 0
          git commit -m "Refreshed hackathon data"
          for attempt in 1 2 3; do
            git push && exit 0
            git pull --rebase -X theirs origin main
          done
          exit 1

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v5
