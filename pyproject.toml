[project]
name = "hackathon-tracker"
version = "0.1.0"
description = "Aggregates hackathon listings from many platforms into one feed"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.scripts]
hackathon-tracker = "hackathon_tracker.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hackathon_tracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
